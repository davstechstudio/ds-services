    /* ================= PAYMENT GATEWAY TOGGLE =================
       Which provider collects money is business config (settings table),
       decided here at runtime — never hardcoded. Secrets live only in
       server/.env; this card just reports whether they are present. */
    let gwInfo = null;
    function gatewayCardHtml() {
        if (!gwInfo) return '<div class="card" id="gwCard"><div class="card-title"><i class="fa-solid fa-building-columns"></i> Payment Gateway</div><p class="empty-note">Loading gateway status…</p></div>';
        const GWS = [
            { v: '', icon: 'fa-flask', label: 'Simulated', desc: 'Sandbox parity — payments confirm instantly, no real money moves' },
            { v: 'paystack', icon: 'fa-credit-card', label: 'Paystack', desc: 'Hosted checkout: MTN/Telecel/AirtelTigo MoMo + cards' },
            { v: 'mtn_momo', icon: 'fa-mobile-screen', label: 'MTN MoMo (direct)', desc: 'Direct Collections push — customer approves on their handset' }
        ];
        const btns = GWS.map(g => {
            const active = gwInfo.gateway === g.v;
            return '<button type="button" class="mini-btn ' + (active ? 'green' : 'ghost-btn') + '" style="min-width: 150px; justify-content: center;" ' +
                'onclick="setGateway(\'' + g.v + '\')">' +
                '<i class="fa-solid ' + g.icon + '"></i> ' + g.label + (active ? ' ✓' : '') + '</button>';
        }).join('');
        const warn = (gwInfo.gateway && !gwInfo.configured)
            ? '<p class="empty-note" style="color: var(--danger-red);">Active gateway is missing credentials — payments will fail until ' + SC.esc(gwInfo.needs.join('; ')) + '.</p>'
            : '';
        const counts = gwInfo.intents.total
            ? '<p class="empty-note">' + gwInfo.intents.total + ' payment attempt(s) — ' +
              ['initiated', 'pending', 'success', 'failed'].map(k => k + ': ' + (gwInfo.intents.byStatus[k] || 0)).join(' · ') + '</p>'
            : '';
        return '<div class="card" id="gwCard"><div class="card-title"><i class="fa-solid fa-building-columns"></i> Payment Gateway' +
            '<span class="pill ' + (gwInfo.gateway === '' ? 'pending' : 'success') + '" style="margin-left: auto;">' + (gwInfo.gateway === '' ? 'simulated' : SC.esc(gwInfo.gateway)) + '</span></div>' +
            '<div class="mini-input" style="flex-wrap: wrap; gap: 8px;">' + btns + '</div>' +
            '<p class="empty-note">Active: <strong>' + (gwInfo.gateway === '' ? 'Simulated (sandbox)' : SC.esc(gwInfo.gateway)) + '</strong> — ' +
            SC.esc(GWS.find(g => g.v === gwInfo.gateway).desc) + (gwInfo.configured ? '' : ' · credentials missing: ' + SC.esc(gwInfo.needs.join('; '))) + '</p>' +
            warn + counts + '</div>';
    }
    async function loadGatewayInfo() {
        try {
            const r = await fetch('/api/payments/gateway', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminSession: '1' })
            });
            const j = await r.json();
            if (j && j.ok) { gwInfo = j; const c = document.getElementById('gwCard'); if (c) c.outerHTML = gatewayCardHtml(); }
        } catch (e) { /* server offline — card keeps its loading note */ }
    }
    async function setGateway(v) {
        try {
            const r = await fetch('/api/payments/gateway', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminSession: '1', gateway: v })
            });
            const j = await r.json();
            if (j && j.ok) { UI.toast('Payment gateway switched to ' + (v === '' ? 'Simulated' : v), 'success'); }
            else { UI.toast((j && j.error) || 'Switch failed', 'error'); }
        } catch (e) { UI.toast('API unreachable — is the server running?', 'error'); }
        await loadGatewayInfo();
    }

    /* ================= LEDGER CSV EXPORT ================= */
    // Escape one CSV cell: quote when needed, double inner quotes, and neutralise
    // spreadsheet formula injection (=+-@ prefixes) for safety.
    function csvCell(v) {
        let s = String(v === null || v === undefined ? '' : v);
        if (/^[=+\-@\t]/.test(s)) s = "'" + s;   // neutralise spreadsheet formula injection
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    // Build the full ledger CSV (all transactions, not just the 40 shown).
    // Pure function so callers can inspect the output before download.
    function buildLedgerCsv() {
        const txns = SC.getTransactions();
        const proName = id => { const p = id ? SC.getPro(id) : null; return p ? p.name : (id || ''); };
        const p2 = n => String(n).padStart(2, '0');
        const stamp = ts => {
            const d = new Date(ts);
            return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
        };
        const typeLabel = { service_payment: 'Service payment', commission: 'Platform commission', payout: 'Worker payout', registration_fee: 'Registration fee', refund: 'Refund' };
        const head = ['Txn ID', 'Date & Time', 'Type', 'Status', 'Amount (GHS)', 'Method', 'Booking', 'Pro ID', 'Pro Name', 'Note'];
        const rows = txns.map(t => [t.id, stamp(t.at), typeLabel[t.type] || t.type, t.status || 'success', Number(t.amount).toFixed(2), t.method || '', t.bookingId || '', t.proId || '', proName(t.proId), t.note || '']);
        return '\uFEFF' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
    }

    function exportLedgerCsv() {
        const txns = SC.getTransactions();
        if (!txns.length) { UI.toast('Ledger is empty — nothing to export', 'error'); return; }
        const csv = buildLedgerCsv();
        const d = new Date(), p2 = n => String(n).padStart(2, '0');
        const fname = 'skillconnect-ledger-' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '.csv';
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        UI.toast('Exported ' + txns.length + ' transactions to ' + fname, 'success', 3600);
    }

    async function payWorker(bookingId) {
        const sel = document.getElementById('paym_' + bookingId.replace(/-/g, '_'));
        const r = SC.markProPaid(bookingId, sel ? sel.value : 'momo');
        if (!r.ok) { await UI.alert(r.error, { title: 'Cannot Mark Paid', type: 'error' }); return; }
        UI.toast('Worker marked as paid — ledger updated', 'success');
        renderTab();
    }

    /* ================= DISPUTES ================= */
    function tabDisputes() {
        const disputes = SC.getDisputes();
        if (!disputes.length) return '<div class="card"><p class="empty-note">No disputes. Open one from a booking on the Track page to test the flow.</p></div>';
        let html = '<div class="card"><div class="card-title"><i class="fa-solid fa-gavel"></i> Disputes — Resolution Queue</div>';
        html += disputes.map(ds => {
            const b = SC.getBooking(ds.bookingId);
            return '<div class="row-card"><div class="row-head"><div style="flex:1;">' +
                '<span class="row-title">' + ds.id + '</span> <span class="pill ' + ds.status + '">' + ds.status.replace('resolved_', '') + '</span><br>' +
                '<span class="row-sub">' + ds.bookingId + (b ? ' · ' + SC.cedi(b.amount) + (b.escrow && !b.escrow.released ? ' in escrow' : ' · escrow released') : '') +
                '<br>Reason: <strong style="color: var(--text-light);">' + SC.esc(ds.reason) + '</strong>' + (ds.details ? ' — "' + SC.esc(ds.details) + '"' : '') + '</span>' +
                '</div></div>' +
                (ds.status === 'open'
                    ? '<div class="mini-input">' +
                      '<button class="mini-btn ghost" onclick="resolveDs(\'' + ds.id + '\',\'resolved_refund\')">Refund Customer</button>' +
                      '<button class="mini-btn ghost" onclick="resolveDs(\'' + ds.id + '\',\'resolved_rematch\')">Rematch New Pro</button>' +
                      '<button class="mini-btn ghost" onclick="resolveDs(\'' + ds.id + '\',\'resolved_release\')">Release To Pro</button></div>'
                    : '') +
                '</div>';
        }).join('');
        return html + '</div>';
    }

    async function resolveDs(id, resolution) {
        const note = await UI.prompt('Resolution note (visible in the audit trail):', '', { title: 'Resolve Dispute', okLabel: 'Resolve', icon: 'gavel' });
        if (note === null) return;
        SC.resolveDispute(id, resolution, note);
        UI.toast(resolution === 'resolved_rematch'
            ? 'Rematch started — the customer now picks a replacement from their tracking page. Escrow stays held.'
            : 'Dispute resolved', 'success', 4200);
        renderConsole();
    }

    /* ================= SUPPORT (contact-form inbox) ================= */
    function tabSupport() {
        const msgs = SC.supportMessages();
        const open = msgs.filter(m => m.status === 'open');
        const done = msgs.filter(m => m.status !== 'open');
        if (!msgs.length) return '<div class="card"><p class="empty-note"><i class="fa-solid fa-headset"></i>No support messages yet. Contact-form submissions from the site land here.</p></div>';

        const card = m => {
            const wa = 'https://wa.me/233' + String(m.phone).replace(/\D/g, '').replace(/^0/, '') + '?text=' +
                encodeURIComponent('Hello ' + m.name + ', this is SkillConnect Support about your message ' + m.ref + '.');
            return '<div class="row-card"><div class="row-head"><div style="flex:1;">' +
                '<span class="row-title">' + m.ref + '</span> <span class="pill ' + (m.status === 'open' ? 'pending' : 'success') + '">' + m.status + '</span>' +
                (m.bookingRef ? ' <span class="pill pending_txn">ref ' + SC.esc(m.bookingRef) + '</span>' : '') + '<br>' +
                '<span class="row-sub"><strong style="color: var(--text-light);">' + SC.esc(m.name) + '</strong> · ' + SC.esc(m.phone) + ' · ' +
                SC.SUPPORT_TOPICS[m.topic] + ' · ' + dt(m.at) + '</span>' +
                '<div class="doc-box" style="margin-top:8px;">' + SC.esc(m.message) + '</div>' +
                (m.handledAt ? '<span class="row-sub">Resolved ' + dt(m.handledAt) + ' by ' + SC.esc(m.handledBy || 'admin') + '</span>' : '') +
                '</div></div>' +
                (m.status === 'open'
                    ? '<div class="mini-input">' +
                      '<a class="mini-btn green" style="text-decoration:none;" href="' + wa + '" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Reply on WhatsApp</a>' +
                      '<a class="mini-btn ghost-btn" style="text-decoration:none;" href="tel:' + SC.esc(m.phone) + '"><i class="fa-solid fa-phone"></i> Call</a>' +
                      '<button class="mini-btn" onclick="markSupportDone(\'' + m.id + '\')"><i class="fa-solid fa-check"></i> Mark Resolved</button>' +
                      '</div>'
                    : '') +
                '</div>';
        };

        let html = '<div class="card"><div class="card-title"><i class="fa-solid fa-headset"></i> Support Inbox</div>' +
            '<p class="row-sub" style="margin-bottom: 12px;">Messages from the site contact form. WhatsApp is the fastest follow-up — the pre-filled chat opens with the customer\'s reference.</p>' +
            (open.length ? open.map(card).join('') : '<p class="row-sub"><i class="fa-solid fa-circle-check" style="color: var(--success-green);"></i> Inbox zero — nothing waiting.</p>') +
            (done.length ? '<div class="card-title" style="margin-top: 14px;"><i class="fa-solid fa-box-archive"></i> Resolved</div>' + done.map(card).join('') : '') +
            '</div>';
        return html;
    }

    async function markSupportDone(id) {
        const r = SC.resolveSupportMessage(id);
        if (!r.ok) { UI.alert(r.error, { title: 'Cannot Resolve', type: 'error' }); return; }
        UI.toast('Support message resolved', 'success');
        renderConsole();
    }

    /* ================= CMS ================= */
    let ussdCodeValue = '';
    function tabCms() {
        const cms = SC.getCms();
        return '<div class="card"><div class="card-title"><i class="fa-solid fa-pen-to-square"></i> Frontpage Content Manager</div>' +
            '<p class="row-sub" style="margin-bottom: 14px;">Edits appear instantly on the Home page (index.html). Last updated ' + dt(cms.updatedAt) + '.</p>' +
            '<div class="cms-field"><label>Hero Title</label><input type="text" id="cmsTitle" value="' + SC.esc(cms.heroTitle) + '"></div>' +
            '<div class="cms-field"><label>Hero Subtitle</label><textarea id="cmsSub" rows="3">' + SC.esc(cms.heroSub) + '</textarea></div>' +
            '<div class="cms-toggle"><input type="checkbox" id="cmsAnnounceOn"' + (cms.announceOn ? ' checked' : '') + '>' +
            '<label for="cmsAnnounceOn" style="margin:0; text-transform:none; font-size: 0.8rem; color: var(--text-light);">Show announcement bar</label></div>' +
            '<div class="cms-field"><label>Announcement Text &mdash; one announcement per line; they auto-slide above the header on the homepage</label><textarea id="cmsAnnounceText" rows="4">' + SC.esc(cms.announceText) + '</textarea></div>' +
            '<div class="cms-field"><label>Registration Fee (GH₵, one-time for new professionals)</label><input type="number" min="0" step="1" id="cmsRegFee" value="' + Number(cms.regFee || 50) + '"></div>' +
            '<div class="cms-field"><label>USSD Shortcode &mdash; shown on the SMS/USSD page once the network provisions it (leave empty to show &ldquo;coming soon&rdquo;)</label><input type="text" id="cmsUssdCode" placeholder="e.g. *384*444" value="' + SC.esc(ussdCodeValue) + '"></div>' +
            '<button class="mini-btn" onclick="saveCms()"><i class="fa-solid fa-floppy-disk"></i> Publish Changes</button>' +
            '<div id="cmsSaved" class="error-box" style="background:var(--success-surface); border-color:var(--success-green); color:var(--success-green); display:none; margin-top: 12px;"><i class="fa-solid fa-check"></i> Published! Open the Home page to see it live.</div>' +
            '</div>' +
            platformSettingsCard() +
            '<div class="card" style="margin-top: 14px;"><div class="card-title"><i class="fa-solid fa-shield-halved"></i> Security — Admin Password</div>' +
            '<div id="pwWarn" class="row-sub" style="margin-bottom: 12px;"></div>' +
            '<div class="cms-field"><label>Current Password</label><input type="password" id="pwCur" autocomplete="current-password"></div>' +
            '<div class="cms-field"><label>New Password (min 8 characters)</label><input type="password" id="pwNew" autocomplete="new-password"></div>' +
            '<div class="cms-field"><label>Repeat New Password</label><input type="password" id="pwNew2" autocomplete="new-password"></div>' +
            '<button class="mini-btn" onclick="changeAdminPw()"><i class="fa-solid fa-key"></i> Update Password</button>' +
            '</div>';
    }

    /* ================= Platform Settings =================
       Tunables that used to live only in code: registration fee (CMS),
       the ID validity/warn/grace windows (settings table), and the
       platform commission rate (settings table — applies to FUTURE
       escrow releases; completed jobs keep their captured commission). */
    function platformSettingsCard() {
        const s = (SC.load && SC.load().settings) || {};
        const cms = SC.getCms();
        const regFee = Number(cms.regFee || 50);
        const idYears = Number(s.id_valid_years) > 0 ? Number(s.id_valid_years) : 5;
        const idWarn = Number(s.id_warn_days) >= 0 ? Number(s.id_warn_days) : 60;
        const idGrace = Number(s.id_grace_days) >= 0 ? Number(s.id_grace_days) : 14;
        const commRaw = Number(s.commission_rate);
        const comm = (isFinite(commRaw) && commRaw > 0 && commRaw <= 0.5) ? commRaw : (SC.COMMISSION_RATE || 0.10);
        const commPct = Math.round(comm * 10000) / 100;
        return '<div class="card" style="margin-top: 14px;"><div class="card-title"><i class="fa-solid fa-sliders"></i> Platform Settings</div>' +
            '<p class="row-sub" style="margin-bottom: 14px;">Business tunables that used to be code-only. Changes take effect immediately across the site.</p>' +
            '<div class="cms-field"><label>Registration Fee (GH₵, one-time for new professionals)</label><input type="number" min="0" step="1" id="psRegFee" value="' + regFee + '"></div>' +
            '<div class="cms-field"><label>ID Validity (years a Ghana Card check stays valid)</label><input type="number" min="1" max="10" step="1" id="psIdYears" value="' + idYears + '"></div>' +
            '<div class="cms-field"><label>ID Expiry Warning (days before expiry to start showing the renewal prompt)</label><input type="number" min="0" max="365" step="1" id="psIdWarn" value="' + idWarn + '"></div>' +
            '<div class="cms-field"><label>ID Grace Period (days after expiry before a pro is hidden from NEW matches)</label><input type="number" min="0" max="365" step="1" id="psIdGrace" value="' + idGrace + '"></div>' +
            '<div class="cms-field"><label>Platform Commission (% of each completed job — applies to future releases only)</label><input type="number" min="0" max="50" step="0.5" id="psCommission" value="' + commPct + '"></div>' +
            '<div class="mini-input" style="margin-top: 4px;"><button class="mini-btn" onclick="savePlatformSettings()"><i class="fa-solid fa-floppy-disk"></i> Save Platform Settings</button>' +
            '<span id="psSavedNote" style="display:none; color:var(--success-green); font-size: 0.78rem; font-weight:600;"><i class="fa-solid fa-check"></i> Saved — live everywhere</span></div>' +
            '<p class="row-sub" style="margin-top: 10px; font-size: 0.72rem;">Commission example: at ' + commPct + '%, a GH₵ 1,000 job pays the pro ' + SC.cedi(Math.round(1000 * (1 - comm))) + ' and the platform ' + SC.cedi(Math.round(1000 * comm)) + '.</p>' +
            '</div>';
    }

    async function savePlatformSettings() {
        const fee = Number($('psRegFee').value);
        const idYears = Math.floor(Number($('psIdYears').value));
        const idWarn = Math.floor(Number($('psIdWarn').value));
        const idGrace = Math.floor(Number($('psIdGrace').value));
        const commPct = Number($('psCommission').value);
        if (!isFinite(fee) || fee < 0) { UI.alert('Registration fee must be 0 or a positive number.', { title: 'Invalid Fee', type: 'error' }); return; }
        if (!isFinite(idYears) || idYears < 1 || idYears > 10) { UI.alert('ID validity must be between 1 and 10 years.', { title: 'Invalid Window', type: 'error' }); return; }
        if (!isFinite(idWarn) || idWarn < 0 || idWarn > 365) { UI.alert('ID expiry warning must be between 0 and 365 days.', { title: 'Invalid Window', type: 'error' }); return; }
        if (!isFinite(idGrace) || idGrace < 0 || idGrace > 365) { UI.alert('ID grace period must be between 0 and 365 days.', { title: 'Invalid Window', type: 'error' }); return; }
        if (!isFinite(commPct) || commPct < 0 || commPct > 50) { UI.alert('Commission must be between 0% and 50%.', { title: 'Invalid Commission', type: 'error' }); return; }

        SC.updateCms({ regFee: fee });

        if (SC.apiMode) {
            const r = await fetch('/api/adminSetSetting', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ entries: [
                    { key: 'id_valid_years', value: idYears },
                    { key: 'id_warn_days', value: idWarn },
                    { key: 'id_grace_days', value: idGrace },
                    { key: 'commission_rate', value: commPct > 1 ? commPct / 100 : commPct }
                ] })
            }).then(x => x.json()).catch(() => null);
            if (!r || !r.ok) { UI.alert((r && r.error) || 'Could not save the settings — check the values and try again.', { title: 'Not Saved', type: 'error' }); return; }
            SC.rehydrate();
        }
        const note = $('psSavedNote');
        if (note) {
            note.style.display = 'inline';
            setTimeout(() => { const n = $('psSavedNote'); if (n) n.style.display = 'none'; }, 3200);
        }
        UI.toast('Platform settings saved — registration fee, ID windows and commission are live.', 'success', 3600);
    }

    async function saveCms() {
        const fee = Number($('cmsRegFee').value);
        if (!isFinite(fee) || fee < 0) {
            UI.alert('Registration fee must be 0 or a positive number.', { title: 'Invalid Fee', type: 'error' });
            return;
        }
        SC.updateCms({
            heroTitle: $('cmsTitle').value.trim(),
            heroSub: $('cmsSub').value.trim(),
            announceOn: $('cmsAnnounceOn').checked,
            announceText: $('cmsAnnounceText').value.trim(),
            regFee: fee
        });
        /* USSD shortcode is a settings-table value (server-validated format);
           empty clears it back to “coming soon”. API mode only — the sandbox
           has no settings service. */
        if (SC.apiMode) {
            const r = await fetch('/api/adminSetSetting', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: 'ussd_code', value: $('cmsUssdCode').value.trim() })
            }).then(x => x.json()).catch(() => null);
            if (r && !r.ok) { UI.alert(r.error || 'Could not save the USSD code.', { title: 'Not Saved', type: 'error' }); return; }
            ussdCodeValue = r ? r.value : ussdCodeValue;
        }
        $('cmsSaved').style.display = 'block';
        setTimeout(() => { const el = $('cmsSaved'); if (el) el.style.display = 'none'; }, 3000);
    }

    async function fillPwWarn() {
        const el = $('pwWarn');
        if (!el) return;
        const usingDefault = await SC.adminUsesDefaultPassword();
        el.innerHTML = usingDefault
            ? '<i class="fa-solid fa-triangle-exclamation"></i> You are using the default admin password — set a real one below before going live.'
            : '<i class="fa-solid fa-circle-check"></i> Custom admin password is set. Stored as a salted scrypt hash — never in plain text.';
        el.style.color = usingDefault ? 'var(--warn-amber-text)' : 'var(--success-green)';
    }

    async function changeAdminPw() {
        const cur = $('pwCur').value, n1 = $('pwNew').value, n2 = $('pwNew2').value;
        if (n1 !== n2) { UI.alert('New passwords do not match.', { title: 'Mismatch', type: 'error' }); return; }
        const r = await SC.setAdminPassword(cur, n1);
        if (!r.ok) { UI.alert(r.error, { title: 'Could Not Change Password', type: 'error' }); return; }
        $('pwCur').value = $('pwNew').value = $('pwNew2').value = '';
        UI.toast('Admin password updated — use it on the sign-in screen from now on.', 'success', 4200);
        fillPwWarn();
    }

    // Auto-login on load when a valid session exists (last statement on purpose)
    initSession();
</script>
